name: clipvault-teckscaler
version: '1.2.0'
summary: Privacy-first Linux clipboard manager with Wayland support and password filtering
description: |
  ClipVault is a lightweight, privacy-focused clipboard manager for Linux desktop environments,
  built specifically for modern Wayland compositors (GNOME, Ubuntu) and X11 sessions.

  Key Capabilities:
  - Quick Copy Shortcuts: Press Ctrl+1 through Ctrl+9 or Enter to copy visible clips and dismiss the window instantly, guided by visible card badges.
  - Bulk History Cleanup: Selectively prune unpinned clipboard history older than 24 hours, 7 days, 30 days, or all unpinned entries, with safety confirmation and permanent pinned protection.
  - Privacy and Password Protection: Automatically detects and filters sensitive clipboard metadata from password managers such as KeePassXC, 1Password, Bitwarden, and KWallet. Secrets are dropped before touching memory or disk.
  - 10 Themeable Palettes: Switch between developer-tailored color schemes (Classic, Cyan, One Dark, Dracula, Nord, Tokyo Night, Monokai, Gruvbox, Solarized, Catppuccin), each with Dark and Light variants.
  - Font Customization: Select font families, adjust sizes from 10px to 22px, and preview changes live with automatic card scaling.
  - Wayland and X11 Native Monitoring: Background capture engine catches copies across active applications without UI stuttering or GNOME dock flickering.
  - Virtualized Performance: Built on Qt Model-View architecture with constant O(1) memory overhead and smooth scrolling.
  - Instant Substring Search: Filter snippets, URLs, and multi-line text in real time.
  - Pinned Items: Pin important clips to anchor them permanently at the top of your history.
  - Global Toggle Shortcut: Launch or hide ClipVault using a customizable global hotkey (such as Super+V).

base: core24
grade: stable
confinement: strict # Use 'strict' for security, or 'classic' if you need unrestricted host access
license: MIT
website: https://www.teckscaler.com
contact: https://www.teckscaler.com
source-code: https://github.com/rajatpateldm-web/ubuntu-clipboard-manager
issues: https://github.com/rajatpateldm-web/ubuntu-clipboard-manager/issues

layout:
  /usr/share/X11/xkb:
    bind: $SNAP/usr/share/X11/xkb

apps:
  clipvault-teckscaler:
    command: bin/clipvault
    desktop: usr/share/applications/clipvault.desktop
    plugs:
      - x11        # Required for X11 clipboard access
      - wayland    # Required for Wayland clipboard access
      - desktop    # Standard desktop integration
      - desktop-legacy
      - unity7
      - opengl
      - network-bind # Required for QLocalServer local IPC socket

  toggle:
    command: bin/clipvault-toggle
    plugs:
      - x11
      - wayland
      - desktop
      - desktop-legacy
      - unity7
      - opengl
      - network-bind

parts:
  clipvault-app:
    plugin: dump
    source: .
    stage:
      - main.py
      - services
      - ui
      - -services/__pycache__
      - -ui/__pycache__
      - -*.pyc

  clipvault-deps:
    plugin: python
    source: .
    python-requirements:
      - requirements.txt
    stage-packages:
      - adwaita-icon-theme
      - hicolor-icon-theme
      - wl-clipboard
      - xclip
      - xkb-data
      - libgl1
      - libegl1
      - libwayland-egl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb-util1
      - libfontconfig1
      - libx11-xcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-sync1
      - libxcb-xfixes0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libwayland-cursor0
      - libwayland-client0
    stage:
      - -venv
      - -tests
      - -test_clipboard.sh
      - -clipvault.db
      - -clipvault.db-shm
      - -clipvault.db-wal
      - -snap
      - -.git
      - -.gitignore
      - -main.py
      - -services
      - -ui
      - -__pycache__
      - -*.pyc

  launchers:
    plugin: dump
    source: snap/local
