[project]
name = "clipvault"
version = "1.1.0"
description = "Privacy-first Linux clipboard manager built with Python and PyQt6 for Wayland and X11."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "PyQt6>=6.6.0",
    "pyperclip>=1.8.2",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["services*", "ui*"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["venv", "snap", "flatpak", "flathub", "store-assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S105", "S106", "S108"]
"services/clipboard_service.py" = ["S603", "S607"]

